name: Automerge Exercism Bot PRs

on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  automerge:
    name: Auto-merge Bot PR
    # Run this job ONLY if the pull request was opened by the Exercism syncer bot
    if: github.actor == 'exercism-solutions-syncer[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Approve the PR
        run: gh pr review --approve "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      - name: Merge the PR
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
